[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asciish"
version = "1.0.0"
description = "A real shell, rendered as giant ASCII made of ASCII. Zoom out."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NoahWLono"}]
dependencies = ["pyte>=0.8.2,<0.9"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.urls]
Homepage = "https://github.com/NoahWLono/asciish"
Issues = "https://github.com/NoahWLono/asciish/issues"

[project.scripts]
asciish = "asciish.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
demo = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
